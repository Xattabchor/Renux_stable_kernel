name: Temporary maximum-bone VGP compile

on:
  push:
    branches:
      - arena/0db9be99-renux-stable-kernel
    paths:
      - .github/workflows/temporary-bone-skinning-build.yml
      - SGX/VGP/generate_bone_skinning.py

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install 32-bit runtime for the SDK VGPCompiler
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6

      - name: Probe largest compilable bone palette
        id: probe
        continue-on-error: true
        run: |
          python3 SGX/VGP/generate_bone_skinning.py --max-try 64

      - name: Publish source and compiler results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in \
            SGX/VGP/build/BoneSkinningMax.vp \
            SGX/VGP/build/BoneSkinningMax.bin \
            SGX/VGP/build/BoneSkinningMax.h \
            SGX/VGP/build/BoneSkinningMax.txt \
            SGX/VGP/build/BoneSkinning_search.log; do
            if test -f "$file"; then git add -f "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Add compiler-probed VGP bone skinning shader'
            git push origin "$GITHUB_REF_NAME"
          fi

      - name: Fail if the compiler accepted no bone count
        if: always()
        run: test -s SGX/VGP/build/BoneSkinningMax.bin
