name: Temporary PhantomMask VGP compile

on:
  push:
    branches:
      - arena/0db9be99-renux-stable-kernel
    paths:
      - .github/workflows/temporary-vgp-sh.yml
      - SGX/VGP/PhantomMask_SH.vp
      - SGX/VGP/README.md

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install 32-bit runtime
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6

      - name: Compile SH VGP shader
        shell: bash
        run: |
          set -euo pipefail
          compiler='SGX/SDK_BIN/Graphics_SDK_setuplinux_4_03_00_02/GFX_Linux_SDK/OGLES/SDKPackage/Utilities/VGPCompiler/Linux/VGPCompiler'
          mkdir -p SGX/VGP/build
          set +e
          "$compiler" -iSGX/VGP/PhantomMask_SH.vp -oSGX/VGP/build/PhantomMask_SH -target=generic > SGX/VGP/build/compiler.log 2>&1
          status=$?
          set -e
          cat SGX/VGP/build/compiler.log
          if [ "$status" -ne 0 ]; then
            echo "VGPCompiler exited with status $status" >&2
            exit "$status"
          fi
          test -s SGX/VGP/build/PhantomMask_SH.bin
          test -s SGX/VGP/build/PhantomMask_SH.h
          ls -lh SGX/VGP/build/PhantomMask_SH.bin SGX/VGP/build/PhantomMask_SH.h

      - name: Publish compile output temporarily
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f SGX/VGP/build/
          git commit -m 'Temporary PhantomMask VGP compile output'
          git push origin "HEAD:${GITHUB_REF_NAME}"
