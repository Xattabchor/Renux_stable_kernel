name: Temporary Quantum mode 7 VGP build

on:
  push:
    branches:
      - arena/0db9be99-renux-stable-kernel
    paths:
      - .github/workflows/temporary-quantum-mode7-build.yml
      - SGX/VGP/QuantumMode7Glass.vp

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install 32-bit runtime
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6

      - name: Compile full VGP program
        shell: bash
        run: |
          set -euo pipefail
          compiler='SGX/SDK_BIN/Graphics_SDK_setuplinux_4_03_00_02/GFX_Linux_SDK/OGLES/SDKPackage/Utilities/VGPCompiler/Linux/VGPCompiler'
          "$compiler" -iSGX/VGP/QuantumMode7Glass.vp -oSGX/VGP/build/QuantumMode7Glass -target=generic > "$RUNNER_TEMP/QuantumMode7Glass_generic.log" 2>&1
          cat "$RUNNER_TEMP/QuantumMode7Glass_generic.log"
          test -s SGX/VGP/build/QuantumMode7Glass.bin
          test -s SGX/VGP/build/QuantumMode7Glass.h
          ls -lh SGX/VGP/build/QuantumMode7Glass.bin SGX/VGP/build/QuantumMode7Glass.h

      - name: Publish generated program files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f SGX/VGP/build/QuantumMode7Glass.bin SGX/VGP/build/QuantumMode7Glass.h
          git commit -m 'Build Quantum mode 7 VGP program'
          git push origin "HEAD:${GITHUB_REF_NAME}"
