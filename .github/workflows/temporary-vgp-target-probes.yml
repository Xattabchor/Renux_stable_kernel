name: Temporary VGP target limit comparison

on:
  push:
    branches:
      - arena/0db9be99-renux-stable-kernel
    paths:
      - .github/workflows/temporary-vgp-target-probes.yml
      - vgp-target-probe/probe.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install 32-bit runtime
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6

      - name: Probe all target variants
        run: |
          mkdir -p vgp-target-probe/out
          python3 vgp-target-probe/probe.py \
            SGX/SDK_BIN/Graphics_SDK_setuplinux_4_03_00_02/GFX_Linux_SDK/OGLES/SDKPackage/Utilities/VGPCompiler/Linux/VGPCompiler

      - name: Publish diagnostics temporarily
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f vgp-target-probe/out/
          git commit -m 'Temporary VGP target limit results'
          git push origin "HEAD:${GITHUB_REF_NAME}"
