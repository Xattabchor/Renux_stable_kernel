name: Build Symbian PVRTC Converter

on:
  push:
    paths:
      - "SGX/VGP/PVRTCConverter/**"
      - ".github/workflows/pvrtc-converter.yml"
  pull_request:
    paths:
      - "SGX/VGP/PVRTCConverter/**"
      - ".github/workflows/pvrtc-converter.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Symbian CLI
        run: python -m pip install "symbian-platform==0.3.0"
      - name: Download and verify SDK 0.3.0
        shell: bash
        run: |
          set -euo pipefail
          sdk_archive="$RUNNER_TEMP/symbian-sdk-0.3.0-linux-x86_64.tar.gz"
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/hpnkv/symbian-platform/releases/download/v0.3.0/symbian-sdk-0.3.0-linux-x86_64.tar.gz" \
            --output "$sdk_archive"
          echo "9be830884a5fd1b9315ea1c11571810f7a50fa673851fa392bb397c6759fec3d  $sdk_archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/symbian-sdk"
          tar -xzf "$sdk_archive" -C "$RUNNER_TEMP/symbian-sdk"
          project="$RUNNER_TEMP/symbian-sdk/examples/PVRTCConverter"
          mkdir -p "$project"
          cp -a SGX/VGP/PVRTCConverter/. "$project/"
          echo "SYMBIAN_PROJECT=$project" >> "$GITHUB_ENV"
      - name: Build ARMv6 E32 executable
        run: symbian app build --project "$SYMBIAN_PROJECT"
      - name: Package SIS
        run: >-
          symbian package
          --project "$SYMBIAN_PROJECT"
          --artifact "$SYMBIAN_PROJECT/.symbian/build/pvrtc_converter.exe"
          --output "$RUNNER_TEMP/pvrtc-converter-sis"
      - name: Upload SIS and package report
        uses: actions/upload-artifact@v4
        with:
          name: Symbian-PVRTC1-Converter-SIS
          path: |
            ${{ runner.temp }}/pvrtc-converter-sis/pvrtc_converter.sis
            ${{ runner.temp }}/pvrtc-converter-sis/package-report.json
          if-no-files-found: error
          retention-days: 30
